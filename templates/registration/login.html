{% load static %}
<!doctype html>
<html lang="en" class="h-full bg-gray-50">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in | Syllabi LMS</title>
    <link href="{% static 'css/tailwind.css' %}" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="h-full flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 bg-gray-50 antialiased text-gray-900">
    <div class="w-full max-w-md space-y-8 bg-white p-8 rounded-xl shadow-lg shadow-gray-200/50 border border-gray-100">
        <div>
            <div class="flex justify-center">
                <a href="{% url 'academics:dashboard' %}" class="flex items-center gap-3 text-green-600 font-bold text-2xl">
                    <div class="w-12 h-12 rounded-xl bg-green-600 text-white flex items-center justify-center shadow-md shadow-green-600/30">
                        <i class="bi bi-mortarboard-fill text-2xl"></i>
                    </div>
                </a>
            </div>
            <h2 class="mt-6 text-center text-3xl font-bold tracking-tight text-gray-900">Welcome back</h2>
            <p class="mt-2 text-center text-sm text-gray-600">Sign in to your account</p>
        </div>
        
        {% if form.errors %}
            <div class="rounded-md bg-red-50 p-4 border border-red-200">
                <div class="flex">
                    <div class="flex-shrink-0">
                        <i class="bi bi-x-circle-fill text-red-400"></i>
                    </div>
                    <div class="ml-3">
                        <h3 class="text-sm font-medium text-red-800">Check your username and password.</h3>
                    </div>
                </div>
            </div>
        {% endif %}
        
        <form class="mt-8 space-y-6" method="post">
            {% csrf_token %}
            <div class="space-y-4 rounded-md shadow-sm">
                <div>
                    <label for="id_username" class="block text-sm font-medium leading-6 text-gray-900">Username</label>
                    <div class="mt-2">
                        <input id="id_username" name="username" type="text" autocomplete="username" required class="block w-full rounded-md border border-gray-300 px-3 py-2 text-gray-900 shadow-sm outline-none placeholder:text-gray-400 focus:border-gray-900 focus:ring-1 focus:ring-gray-900 sm:text-sm sm:leading-6 px-3">
                    </div>
                </div>
                <div>
                    <label for="id_password" class="block text-sm font-medium leading-6 text-gray-900">Password</label>
                    <div class="mt-2">
                        <input id="id_password" name="password" type="password" autocomplete="current-password" required class="block w-full rounded-md border border-gray-300 px-3 py-2 text-gray-900 shadow-sm outline-none placeholder:text-gray-400 focus:border-gray-900 focus:ring-1 focus:ring-gray-900 sm:text-sm sm:leading-6 px-3">
                    </div>
                </div>
            </div>

            <div>
                <button type="submit" class="group relative flex w-full justify-center rounded-md bg-green-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-green-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-green-600">
                    Sign in
                </button>
            </div>
        </form>
    </div>
</body>
</html>
