{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in | Syllabi LMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="auth-body d-flex align-items-center justify-content-center p-4">
    <main class="auth-card card border-0 shadow-sm p-4">
        <a class="brand d-flex align-items-center gap-3 text-decoration-none mb-4" href="{% url 'academics:dashboard' %}">
            <span class="brand-mark">S</span>
            <span>
                <strong class="d-block text-dark">Syllabi</strong>
                <small class="text-secondary">Smart LMS</small>
            </span>
        </a>
        <h1 class="h3 fw-bold mb-3">Welcome back</h1>
        {% if form.errors %}
            <div class="alert alert-danger">Check your username and password.</div>
        {% endif %}
        <form method="post" class="auth-form vstack gap-3">
            {% csrf_token %}
            <label>
                <span class="form-label fw-semibold">Username</span>
                {{ form.username }}
            </label>
            <label>
                <span class="form-label fw-semibold">Password</span>
                {{ form.password }}
            </label>
            <button class="btn btn-success" type="submit">Sign in</button>
        </form>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
