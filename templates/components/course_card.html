<article class="relative flex flex-col justify-between overflow-hidden rounded-2xl bg-white shadow-sm ring-1 ring-gray-900/5 hover:shadow-lg hover:ring-green-600/20 hover:-translate-y-1 transition-all duration-300 h-full">
    <div class="p-6 flex flex-col h-full">
        <div class="flex justify-between items-center gap-x-4 mb-4">
            <span class="inline-flex items-center rounded-md bg-green-50 px-2 py-1 text-xs font-medium text-green-700 ring-1 ring-inset ring-green-600/10">{{ course.code }}</span>
            {% if course.is_active %}<span class="inline-flex items-center rounded-md bg-green-50 px-2 py-1 text-xs font-medium text-green-700 ring-1 ring-inset ring-green-600/20">Active</span>{% endif %}
        </div>
        <div class="group relative">
            <h3 class="text-lg font-semibold leading-6 text-gray-900 group-hover:text-green-600">
                <a href="{{ course.get_absolute_url }}">
                    <span class="absolute inset-0"></span>
                    {{ course.title }}
                </a>
            </h3>
            <p class="mt-2 text-sm leading-6 text-gray-600 line-clamp-3">{{ course.description|default:"Course materials and learning activity are ready." }}</p>
        </div>
        
        <div class="mt-auto pt-6 flex justify-between gap-x-4 text-xs leading-5 text-gray-500">
            <div class="flex items-center gap-1"><i class="bi bi-tag text-gray-400"></i> {{ course.department|default:"General" }}</div>
            <div class="flex items-center gap-1"><i class="bi bi-person text-gray-400"></i> {{ course.instructor.get_full_name|default:course.instructor.username }}</div>
        </div>
    </div>
</article>
