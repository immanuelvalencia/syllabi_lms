<article class="card border-0 shadow-sm h-100 stat-card">
    <div class="card-body">
        <span class="text-secondary small fw-semibold text-uppercase">{{ label }}</span>
        <strong class="d-block display-6 fw-bold text-success mt-2">{{ value }}</strong>
        {% if caption %}<small class="text-secondary">{{ caption }}</small>{% endif %}
    </div>
</article>
