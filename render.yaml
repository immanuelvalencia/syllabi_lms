services:
  # The main Django web server
  - type: web
    name: syllabi-web
    env: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        value: "syllabi-media"
      - key: AWS_S3_REGION_NAME
        value: "auto"
      - key: AWS_S3_ENDPOINT_URL
        value: "https://rmootwcefmxlxfkomubz.supabase.co/storage/v1/s3"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: syllabi-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: syllabi-redis
          property: connectionString
  # The Celery background worker
  - type: worker
    name: syllabi-worker
    env: docker
    plan: starter # Changed to starter assuming they upgrade
    dockerCommand: celery -A config worker --loglevel=info --concurrency=2
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        value: "syllabi-media"
      - key: AWS_S3_REGION_NAME
        value: "auto"
      - key: AWS_S3_ENDPOINT_URL
        value: "https://rmootwcefmxlxfkomubz.supabase.co/storage/v1/s3"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: syllabi-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: syllabi-redis
          property: connectionString

  # The internal Redis message broker
  - type: redis
    name: syllabi-redis
    plan: free
    ipAllowList: [] # Strict internal networking only
