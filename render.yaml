services:
  - type: web
    name: syllabi-lms-web
    runtime: docker
    plan: starter
    preDeployCommand: python manage.py migrate
    dockerCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: syllabi-lms-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: syllabi-lms-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: syllabi-lms-redis
          property: connectionString

  - type: worker
    name: syllabi-lms-worker
    runtime: docker
    plan: starter
    dockerCommand: celery -A config worker --loglevel=info --concurrency=2
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        fromService:
          type: web
          name: syllabi-lms-web
          envVarKey: SECRET_KEY
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: syllabi-lms-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: syllabi-lms-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: syllabi-lms-redis
          property: connectionString

  - type: keyvalue
    name: syllabi-lms-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: syllabi-lms-db
    plan: starter
