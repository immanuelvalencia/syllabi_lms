services:
  # The main Django web server
  - type: web
    name: syllabi-web
    env: docker
    plan: free
    dockerCommand: sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --threads 2"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: syllabi-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: syllabi-redis
          property: connectionString

  # The Celery background worker
  - type: worker
    name: syllabi-worker
    env: docker
    plan: free
    dockerCommand: celery -A config worker --loglevel=info --concurrency=2
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: syllabi-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: syllabi-redis
          property: connectionString

  # The internal Redis message broker
  - type: redis
    name: syllabi-redis
    plan: free
    ipAllowList: [] # Strict internal networking only
